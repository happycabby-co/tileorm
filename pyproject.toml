[project]
name = "tileorm"
version = "0.4.0"
description = "An ORM for Tile38 inspired by Peewee - with Pydantic validation"
authors = [{ name = "Alex Ward", email = "alxwrd@googlemail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyle38~=0.14.2",
    "pydantic~=2.13.4",
    "pygeohash~=3.2.2",
]

[dependency-groups]
dev = [
    "ruff~=0.16.2",
    "pytest~=8.3.3",
    "pytest-cov~=6.0.0",
    "pytest-asyncio~=0.24.0",
    "ty>=0.0.69",
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.1",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build~=0.10.0"]
build-backend = "uv_build"


[tool.coverage.run]
data_file = "tests/coverage/.coverage"

[tool.poe.tasks]
all.sequence = [
    { ref = "format" },
    { ref = "lint" },
    { ref = "check" },
    { ref = "test" },
]
all.help = "Run all check tasks"

_fmt = "ruff format ${PWD}"
_sort = "ruff check --select I --fix ${PWD}"

format.sequence = [ "_fmt", "_sort" ]
format.help = "Formats the project(s) in scope"

lint.cmd = "ruff check --fix ${PWD}"
lint.help = "Perform a lint check"

check.cmd = "ty check ${PWD}"
check.help = "Performs type checking"

test.cmd = "pytest ${PWD}"
test.help = "Runs all tests for the project(s) in scope"

"cov:html".cmd = "pytest --cov=tileorm --cov-report=html:tests/coverage/htmlcov ${PWD}"
"cov:html".help = "Runs tests with coverage, producing an HTML report"

"cov:xml".cmd = "pytest --cov=tileorm --cov-report=xml:tests/coverage/coverage.xml ${PWD}"
"cov:xml".help = "Runs tests with coverage, producing an XML report (for CI tooling)"

cov.sequence = [ "cov:html", "cov:xml" ]
cov.help = "Runs tests with coverage, producing HTML and XML reports"


"ci:format" = { cmd = "ruff format --check ${PWD}", help = "Fails if the code is not formatted correctly" }
"ci:lint" = { cmd = "ruff check ${PWD}", help = "Fails if lint errors, but won't auto fix" }
